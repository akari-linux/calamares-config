# https://github.com/calamares/calamares/blob/calamares/settings.conf

modules-search: [ local ]

instances:
  - id: desktopenv
    module: packagechooser
    config: desktopenv.conf

sequence:
- show:
  - welcome
#  - notesqml
#  - packagechooserq@licenseq
  - locale
  - keyboard
  - packagechooser@desktopenv
  - partition
  - users
#  - tracking
  - summary
- exec:
#  - dummycpp
#  - dummyprocess
#  - dummypython
  - partition
#  - zfs
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
#  - luksbootkeyfile
#  - luksopenswaphookcfg
#  - dracutlukscfg
  - fstab
#  - plymouthcfg
#  - zfshostid
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
#  - dracut
  - initramfs
#  - grubcfg
  - bootloader
  - umount
- show:
  - finished


branding: akari

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false